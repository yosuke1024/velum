era: guilds

# 生成がこの canon と矛盾したら、その日を破棄する。
# 条文番号などの細部は生成の即興を許すが、下の fixed と矛盾してはいけない。

fixed:
  - id: appraisal-ranks
    fact: |
      大鑑定院の階級は、無銘（見習い）→ 仮銘 → 銘持ち → 大鑑定官。
      銘は鑑定書に打つ個人印で、打った鑑定に一生責任を負う。
  - id: regulation-1
    fact: 鑑定規約 第1条「物は嘘をつかない。嘘をつくのは目である。」
  - id: regulation-31
    fact: 鑑定規約 第31条「鑑定士は、感情を鑑定書に持ち込まない。」
  - id: regulation-207
    fact: 鑑定規約 第207条「出自の知れない品を、出自不明と記すことを恥じるな。」
  - id: provisional-sigil-review
    fact: 仮銘審査を受けるには、銘持ち一名の推薦状が要る。

institutions:
  - id: grand-court
    name:
      ja: 大鑑定院
      en: The Grand Court of Appraisal
    # 読者向けの組織要約。feed の lore.json が出す（note は出さない）。
    summary:
      ja: |
        鑑定を制度に変えた組織。階級と規約で物の真贋を裁き、鑑定書に
        打つ銘ひとつが職人の一生を左右する。のちの時代に語られる
        「ギルド」の呼び名は、ここを起点としている。
      en: |
        The body that turned appraisal into an institution. It judges real from
        fake by rank and regulation, and one sigil on a certificate can decide a
        craftsman's life. The "Guild" of later ages traces its name back to this
        house.
    note: |
      鑑定士を育て、鑑定書に権威を与える制度の中心。
      のちの時代の「鑑定ギルド」の前身にあたる。
  - id: vesper-workshop
    name:
      ja: ヴェスパー工房
      en: The Vesper Workshop
    note: |
      名の知れた贋作師の一家。「夕べの祈り」の含みを持つ工房銘。
      テオの実家であり、摘発後は兄ロウが継いでいる。

places:
  - id: grand-court-hall
    name: 大鑑定院
    note: テオが住み込みで働く。審査室、書庫、無銘の相部屋。
  - id: workshop-street
    name: 工房通り
    note: 職人と商人の通り。持ち込み鑑定の依頼はここから来ることが多い。
  - id: court-gate
    name: 大鑑定院の門前
    note: ロウが時折現れる場所。中には入ってこない。

observances:
  - id: provisional-sigil-review
    name: 仮銘審査
    when: { month: 7, day: 30 }
    note: 星の月の末日。推薦状はその前に揃っていなければならない。
  - id: workshop-fair
    name: 工房通りの大市
    when: { month: 8, day: 10 }
    note: 職人が自分の仕事を誇る日。持ち込み鑑定がいちばん増える。
  - id: founding-day
    name: 開院記念日
    when: { month: 1, day: 1 }
    note: 芽の月の初日。全員の前で規約第1条が朗読される。
  - id: inventory-nights
    name: 棚卸しの五夜
    when: { intercalary: true }
    note: 年の外の5日、大鑑定院は全所蔵の棚卸しをする。台帳と現物の名を突き合わせる夜。

# World Appraisal Snapshot へ射影する時代の輪郭。カードのプロンプト素材に
# 出してよい文だけを書く（読者だけが知る注記・人物の秘密は書かない）。
appraisal:
  profile: |
    鑑定が制度になった時代。大鑑定院が階級（無銘→仮銘→銘持ち→大鑑定官）と
    規約で真贋を裁き、鑑定書に打つ銘は打った者の一生の責任になる。工芸と
    学術の水準は高いが、奇跡のたぐいは制度の外に置かれている。
  values:
    - 銘と、それに伴う一生の責任
    - 規約と様式——「物は嘘をつかない。嘘をつくのは目である」
    - 技法・道具痕から作り手を読むこと
    - 出自の知れない品を、出自不明と記す誠実さ
  taboos:
    - 銘のない鑑定書
    - 贋作づくりと、その幇助
    - 感情を鑑定書に持ち込むこと
  events:
    - 仮銘審査が星の月の末日に近づいている——銘持ち一名の推薦状がなければ受けられない
    - 工房通りの大市が、持ち込み鑑定でいちばん賑わう
    - 開院記念日には、全員の前で規約第1条が朗読される
  absent:
    - 電気・蒸気などの近代機械
    - 死者の遺品を届ける回収人の制度（後世のもの）
    - 「目覚め」という言葉（後世の概念）
