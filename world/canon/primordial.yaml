era: primordial

fixed:
  - id: no-writing
    fact: |
      サナ氏族に文字はない。記録の手段はなく、すべては口伝と儀式の所作で伝わる。
      したがってウタの「日記」は書いたものではなく、夜にひとりで唱える言葉。
      5人の主人公で唯一、書かない語り手である。
  - id: succession-at-star-festival
    fact: |
      継承の儀は星祭りの夜にしか行えず、先代が執り行う決まり。
      ノノは儀を行う前に急死した。誰がウタを継がせられるのかが宙に浮いている。
  - id: singing-vale-is-forbidden
    fact: |
      鳴りの谷は禁忌。物がひとりでに鳴る谷。
      ウタだけが「あそこは静かだ」と言う。
  - id: the-voice-has-no-fixed-form
    fact: |
      「声」に定型はない。物によって単語だったり、感情だったり、匂いのような何かだったりする。
      ウタは毎回それを自分の言葉に翻訳している。翻訳の癖が彼女の人格そのもの。
  - id: listener-is-a-role-not-a-rank
    fact: |
      氏族はウタを「聴き手」と呼ぶが、それは職能の呼び名であって継承の証ではない。

institutions:
  - id: sana
    name:
      ja: サナ氏族
      en: The Sana
    # 読者向けの組織要約。feed の lore.json が出す（note は出さない）。
    # 声が実在するかは断定しない（時代要約が「声とも兆しともつかないもの」と
    # ぼかしているのと同じ規律。断定するとウタの糸の答え合わせになる）。
    summary:
      ja: |
        文字を持たない氏族。名は「水を分ける者」に由来し、季節ごとに
        野営地を移しながら暮らす。物には声が宿ると信じ、それを聴くと
        される「聴き手」を立て、世界の記憶を口伝だけで受け渡している。
      en: |
        A tribe without writing. Their name means "those who divide the water,"
        and they move camp with the seasons. They hold that things carry voices,
        appoint Listeners said to hear them, and pass the world's memory on by
        word of mouth.
    note: 「水を分ける者」の意。文字を持たない。

places:
  - id: sana-camp
    name: サナ氏族の野営地
    note: 季節で移動する。
  - id: chiefs-tent
    name: 長の天幕
    note: ガルドが取り上げた「歌う石」が今もここにある。
  - id: singing-vale
    name:
      ja: 鳴りの谷
      en: The Singing Vale
    note: 物がひとりでに鳴る谷。立ち入りは禁忌。
  - id: star-hill
    name: 星見の丘
    note: 星祭りが行われる。継承の儀もここで。
  - id: water-place
    name: 水場
    note: 旱魃の年、ウタが「声」で当てたとされる場所。

# サナ氏族は年を数えない。月の呼び名と夜の数、季節の匂いで時を測る。
calendar_note: |
  文字がないので、日付を「◯日」とは数えない。
  「星の月」「あと十一の夜」「水の匂いが変わる頃」——それが彼らの暦。

observances:
  - id: star-festival
    name: 星祭り
    when: { month: 7, day: 15 }
    note: 星の月の満ちる夜。継承の儀はこの夜にしか行えない（fixed 参照）。
  - id: water-sharing
    name: 水分けの日
    when: { month: 5, day: 1 }
    note: 光の月の初日。水場の配分を決め直す。サナ（水を分ける者）の名の由来の日。
  - id: counting-nights
    name: 遡りの五夜
    when: { intercalary: true }
    note: 火を絶やさず、先祖の名を口伝で数える5夜。名を落とすと、その人がいなかったことになる。

# World Appraisal Snapshot へ射影する時代の輪郭。カードのプロンプト素材に
# 出してよい文だけを書く（読者だけが知る注記・人物の秘密は書かない）。
appraisal:
  profile: |
    文字を持たない前史。サナ氏族は季節とともに移動しながら暮らし、口伝と
    儀式の所作だけで世界を覚えている。金属加工や貨幣はなく、物の価値は
    それが何の兆しかで測られる。
  values:
    - 声と兆しへの畏れ
    - 名を口伝で数えること——名を落とせば、その人はいなかったことになる
    - 水を分かち合うこと
    - 拾うことと奪うことの区別
  taboos:
    - 鳴りの谷への立ち入り
    - 継承の儀を経ずに聴き手を名乗ること
    - 火を絶やすこと（遡りの五夜）
  events:
    - 旱魃の年、水場を「声」で当てたと伝わる娘がいる
    - 長ガルドが「歌う石」を取り上げ、長の天幕に納めた
    - 星祭りが近づいている——継承の儀は、その夜にしか行えない
  absent:
    - 文字と記録
    - 貨幣と市場
    - 鑑定という職業（まだ存在しない）
    - 精密な機械・合金・ガラス細工
