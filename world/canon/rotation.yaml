# 日記のローテーション
#
# 書くのは1日ひとり。5日周期で回る。
# その時代の World Tick は、番の日にだけ進む。
#
# 世界の時系列（原初 → ギルド → 大収束 → 破砕 → 静寂）とは意図的に違う順序。
# 読者は日付順に読むと時代を飛び回り、時代順に読むと歴史を追うことになる。

start_date: null # 稼働開始日。M2 で決める。

order:
  - guilds # テオ
  - silent # リコ
  - convergence # セヴラン
  - fracture # カヤ
  - primordial # ウタ

# 30日運転すると、各主人公は6本ずつ書く。
# レビューは 7 / 14 / 30 日目。確認項目は docs/diary.md を参照。
