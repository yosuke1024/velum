era: convergence

fixed:
  - id: convergence-is-one-year
    fact: |
      大収束は417年の一年間の出来事であり、いまは進行中。
      セヴランの日記はリアルタイムの一次資料であり、後世から引用される文書になる。
  - id: great-clock
    fact: |
      アルヴィスの大時計は四時十七分で溶けて止まっている。
      417 という年号との符合を、セヴランは「偶然、要検証」と書き続けている。
  - id: record-format
    fact: |
      記録院の様式では、各項に「確認」「未確認」「要検証」のいずれかを付す。
      訂正は消さず、見え消し線で残す。
  - id: rifts-move
    fact: |
      裂け目は場所が固定されていない。街の地理が日ごとに変わる。
  - id: record-house-is-gone
    fact: |
      記録院は崩壊し、地下書庫は裂け目に呑まれて百年分の記録が消えた。
      セヴランは組織として存在しない記録院の、最後の書記である。
  - id: the-unending-year
    fact: |
      大収束は年の初め、芽の月一日に始まった。以来、暦の月日は進むのに、年は417のまま変わらない。
      セヴランは日々の記録に、芽の月一日からの通算日「収束暦」を併記している。
      年が変わらないことについて、彼は「未確認」と書き続けている。

institutions:
  - id: record-house
    name:
      ja: 記録院
      en: The Record House
    # 読者向けの組織要約。feed の lore.json が出す（note は出さない）。
    summary:
      ja: |
        公的記録を担っていた組織。アルヴィスの出来事を日付とともに綴じ、
        誰が何を証したかを残す役目を負っていた。大収束の混乱のなかで
        崩壊し、いまは廃墟と、その名を肩書きに残す者だけが残っている。
      en: |
        The body that kept the public record. It bound the events of Alvis with
        their dates, noting who had attested to what. It fell in the turmoil of
        the Convergence; what remains is a ruin, and those who still carry its
        name as a title.
    note: |
      アルヴィスの公的記録を担っていた組織。崩壊済み。
      セヴランは日記の署名に、いまも「記録院書記」と肩書きを入れる。

places:
  - id: record-house-ruin
    name: 記録院の廃墟
    note: セヴランの住処。本棚の影にフムが住んでいる。
  - id: alvis-square
    name: アルヴィス広場
    note: 大時計がある。四時十七分で止まっている。
  - id: undercroft
    name: 地下書庫の跡
    note: 百年分の記録が消えた場所。フムはここの本を暗唱する。
  - id: moving-rifts
    name: 動く裂け目
    note: 日ごとに位置が変わる。近づくと物の性質が変わる。

cities:
  - id: alvis
    name:
      ja: アルヴィス
      en: Alvis
    note: 裂け目の都。収束の中心。

calendar_note: |
  アルヴィスの祭日は、中止されたまま誰も再開を宣言していない。
  observances が空なのは書き忘れではない。この街の暦にはもう、節目がない。
  あるのは月日と、収束暦の通算日と、四時十七分だけである。

observances: []

# World Appraisal Snapshot へ射影する時代の輪郭。カードのプロンプト素材に
# 出してよい文だけを書く（読者だけが知る注記・人物の秘密は書かない）。
appraisal:
  profile: |
    417年、裂け目がすべてを混ぜた一年。街の地理は日ごとに変わり、大時計は
    四時十七分で止まり、暦の月日が進んでも年は417のまま動かない。記録院は
    崩壊し、公的な記録は最後の書記ひとりの手に残されている。
  values:
    - 確認・未確認・要検証を分けること
    - 訂正を消さず、見え消し線で残すこと
    - 記録が残ること、それ自体の価値
  taboos:
    - 裂け目に近づくこと
    - 確かめていないことを「確認」と記すこと
  events:
    - 大収束は年の初め、芽の月一日に始まり、いまも進行中
    - 記録院の地下書庫が裂け目に呑まれ、百年分の記録が消えた
    - アルヴィスの祭日は中止されたまま、誰も再開を宣言していない
  absent:
    - 安定した地理（道順は日ごとに変わる）
    - 機能する行政・組織
    - 暦の節目と祭日（中止されたまま）
