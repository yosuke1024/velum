# Velum の5つの時代
#
# era の ID は PixTale 本体の Chronicles 機能で既に使われている値と一致する。
# 変更してはいけない。鑑定時にアイテムへ付与される時代がこの5つであり、
# Persona Snapshot のルーティングもこの ID で行う。

eras:
  - id: primordial
    name:
      ja: 原初の沈黙
      en: Primordial Silence
    years: "~???–0"
    order: 1
    protagonist: uta
    # 鑑定時にこの時代が付与される基準（PixTale 側の判定）
    assignment: 原始的、古代的、未加工
    question:
      ja: これは何の兆しか
      en: What omen is this?
    focus: 素材の声・霊・禁忌
    humor: 現代物の完全な誤読（バーコードを星図と読む、端子を精霊の口と読む）
    # 読者向けの時代要約。feed の lore.json が出す。
    summary:
      ja: |
        文字のない前史。人はまだ物に名を付けず、物の側が先に語りかけてくる。
        サナ氏族の「聴き手」が、声とも兆しともつかないものを聴き取り、
        口伝だけで世界を覚えている時代。
      en: |
        A prehistory without writing. People have not yet named the things
        around them — the things speak first. The Listeners of the Sana catch
        what may be voices or omens, and the world is remembered only by
        word of mouth.
    palette:
      base: ["#E8E0CF", "#F0EDE4"]
      accent: "#2B3A67"

  - id: guilds
    name:
      ja: ギルドの時代
      en: Guild Age
    years: "0–400"
    order: 2
    protagonist: teo
    assignment: 制度的、工芸的、学術的
    question:
      ja: どう作られたか
      en: How was this made?
    focus: 技法・銘・規格・道具痕
    humor: 官僚的不条理（現代物にも許可証・書式・等級を要求する）
    # 読者向けの時代要約。feed の lore.json が出す。
    summary:
      ja: |
        鑑定が制度になった時代。大鑑定院が階級と規約で物の真贋を裁き、
        鑑定書に打つ銘ひとつが職人の一生を左右する。整いすぎた制度の
        隙間で、規約に載らない目が育ちはじめている。
      en: |
        The age when appraisal became an institution. The Grand Court judges
        real from fake with ranks and regulations, and a single sigil on a
        certificate can decide a craftsman's life. In the gaps of a system
        grown too orderly, an eye the regulations never wrote down is
        beginning to open.
    palette:
      base: ["#2F4A3D", "#E8E0CF"]
      accent: "#B08D57"

  - id: convergence
    name:
      ja: 大収束
      en: Convergence
    years: "417"
    order: 3
    protagonist: sevran
    assignment: 混沌的、次元歪曲、異形
    question:
      ja: 何が混ざったか
      en: What has been mixed into this?
    focus: 歪み・異界痕・次元の匂い
    humor: あり得ない事象を完全に事務的な様式で記録する deadpan
    # 読者向けの時代要約。feed の lore.json が出す。
    summary:
      ja: |
        417年、すべてが混ざった一年。裂け目が街の地理を日ごとに書き換え、
        大時計は四時十七分で止まったまま。暦の月日は進むのに年は変わらない
        その一年を、最後の書記がひとりで記録し続けている。
      en: |
        Year 417 — the year everything mixed. Rifts redraw the city's
        geography daily, and the great clock stands stopped at 4:17. The
        months pass but the year refuses to change, and one last scribe keeps
        recording it alone.
    palette:
      base: ["#1F2430", "#3A4A63"]
      accent: "#6B4E8C"

  - id: fracture
    name:
      ja: 破砕戦争
      en: Fracture War
    years: "417–800"
    order: 4
    protagonist: kaya
    assignment: 戦闘跡、軍事的、絶望的
    question:
      ja: 誰が持っていたか
      en: Who carried this before?
    focus: 傷・修理痕・磨り減り・遺された未練
    humor: 何でも戦傷として読む＋過剰に儀礼的な「お届け」プロトコル
    # 読者向けの時代要約。feed の lore.json が出す。
    summary:
      ja: |
        戦争が383年続く時代。武器を持たない白い外套の回収人だけが戦線を
        渡り、死者の持ち物を遺族へ届ける。物は傷と修理痕で人生を語り、
        遺品を読むことが弔いの技術になった。
      en: |
        An age of a war 383 years long. Only the unarmed reclaimers in their
        white cloaks may cross the lines, returning the belongings of the dead
        to their families. Things tell lives through scars and mended seams,
        and reading a relic has become an art of mourning.
    palette:
      base: ["#D6D2C8", "#3E3128"]
      accent: "#A83A4A"

  - id: silent
    name:
      ja: 静寂の時代
      en: Silent Age
    years: "800–現在"
    order: 5
    protagonist: riko
    # 鑑定で最も一般的に付与される時代。統合後の登板数が最も多い。
    assignment: 休眠的、日常的、最も一般的
    question:
      ja: まだ何ができるか
      en: What can this still do?
    focus: 日用品に眠る力・使い道・値段・持ち主
    humor: 日常品への過剰な畏怖からの、直後の即物的な値付け
    # 読者向けの時代要約。feed の lore.json が出す。
    summary:
      ja: |
        遺物が眠り、奇跡が伝承になった現在。「目覚め」を見たと言い切れる者は
        もう生きていない。それでも市場には物が並び、まだ何かできると信じる
        者が、今日も値札を書き続けている。
      en: |
        The present, where relics sleep and miracles have become folklore.
        No one still living can claim to have seen an awakening. And yet the
        markets go on, and those who believe a thing can still do something
        keep writing price tags for it.
    palette:
      base: ["#CBB78E", "#3E3128"]
      accent: "#A8433A"
