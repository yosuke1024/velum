era: silent

fixed:
  - id: no-waking-observed
    fact: |
      「目覚め」——遺物が力を示す現象——は、公式には百年以上観測されていない。
      いまや伝承と詐欺の領域であり、リコの願望は世間ではロマンか商売文句でしかない。
  - id: deed-auction
    fact: |
      「目覚めの棚」の権利書は質屋オルバが持っており、秋の競売に出すと告知されている。
  - id: riko-license
    fact: |
      リコの行商許可証の職業欄は「古物商」。本人の自称は「遺物商」。役所は訂正してくれない。
  - id: riko-trading-is-one-person
    fact: |
      「リコ商会」の社員はリコひとり。鑑定部も経理部門も存在しない。

institutions:
  - id: riko-trading
    name:
      ja: リコ商会
      en: Riko Trading
    # 読者向けの組織要約。feed の lore.json が出す（note は出さない）。
    summary:
      ja: |
        静寂の時代を巡る行商。奇物とささやきを看板に掲げ、巡回路を辿って
        市から市へ品を運ぶ。目覚めを見たという話を売り文句にしながら、
        値札を書く手はいつも慎重である。
      en: |
        A peddler working the Silent Age. The sign promises wonders and
        whispers, and goods travel from market to market along the circuit
        roads. It sells stories of awakenings — though the hand that writes the
        price tag is always careful.
    note: |
      屋号。看板には「WONDERS, WHISPERS, & WHATNOT」。
      架空の部門を騙るのが彼女の口癖であり、ひとりであることの埋め合わせ。

places:
  - id: waking-shelf
    name:
      ja: 目覚めの棚
      en: The Waking Shelf
    note: |
      ガロンの店だった建物。今は倉庫。
      10歳のリコが「本物が目覚める瞬間」を見た——と信じている場所。
  - id: orba-pawnshop
    name: オルバの質屋
    note: 権利書を握る金貸し。
  - id: northern-market
    name: 北の市
    note: 巡回路で最大の市。在庫を捌くならここ。
  - id: circuit-towns
    name: 巡回路の市場町
    note: 名前のない小さな市が点在する。雨が降れば客は来ない。

observances:
  - id: northern-market
    name: 北の市
    when: { month: 7, day: 10 }
    note: 星の月10日から十日間。巡回路で最大の市。
  - id: orba-auction
    name: 権利書の競売
    when: { month: 8, day: 30 }
    note: 穂の月の末日。オルバが告知した競売に「目覚めの棚」の権利書が出る。
  - id: waking-festival
    name: 目覚めの祭
    when: { month: 5, day: 20 }
    note: 伝説の目覚めを再演する夏祭り。誰も本物を見たことがない。
  - id: leftover-market
    name: 余り市
    when: { intercalary: true }
    note: 年の外の5日に立つ市。「月に属さない日に買った物は持ち主を選ぶ」という迷信がある。

# World Appraisal Snapshot へ射影する時代の輪郭。カードのプロンプト素材に
# 出してよい文だけを書く（読者だけが知る注記・人物の秘密は書かない）。
appraisal:
  profile: |
    遺物が眠り、奇跡が伝承になった現在。「目覚め」は百年以上、公式には
    観測されていない。市場と巡回路が生活の骨組みで、古物は由来書と値札で
    取引される。鑑定は職業として残るが、日々の実態は目利きと商いである。
  values:
    - 値付けと、商いの口上
    - 物の由来と、持ち主の来歴
    - 日用品を使い切ること
    - 伝承へのロマンと、それを疑う目の同居
  taboos:
    - 由来書の偽造
    - 「目覚め」を騙って高値を付けること
    - 余り市で買った物を粗末に扱うこと——「月に属さない日に買った物は持ち主を選ぶ」という迷信がある
  events:
    - 星の月10日から十日間、巡回路で最大の北の市が立つ
    - 穂の月の末日、質屋オルバの競売に「目覚めの棚」の権利書が出ると告知されている
    - 目覚めの祭では伝説の目覚めが再演される——本物を見たことのある者はいない
  absent:
    - 公式に観測された「目覚め」（百年以上ない）
    - 戦争（遠い伝承になっている）
    - 大収束期の裂け目（すでに閉じたと伝えられる）
