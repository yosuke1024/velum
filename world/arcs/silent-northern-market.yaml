  ja: 北の市と権利書
  en: The Northern Market and the Deed

premise: |
  オルバが「目覚めの棚」の権利書を秋の競売にかける。
  リコは頭金を作るため北の市を目指して在庫を捌く——が、
  一番高く売れそうな品ほど、なぜか売れない値段を付けてしまう。

