# 日次の生成。
#
# ギルド → 静寂 → 大収束 → 破砕 → 原初 の5日周期で、番の時代の主人公が日記を書く。
# 出来事はここでは作らない。季の計画（world/seasons/）から、その日の話を取り出す。
#
# 計画がない日は何もせずに終わる。季の計画は npm run plan で立て、
# 走らせる前に人間が読んで直す。自動では計画しない——それがこの構造の主目的なので。
#
# 構造ゲートに違反した日は、状態ファイルを変更せずに失敗記録だけを残す。
# 欠けた日は隠さない。季の計画は消さないので、同じ日をやり直せる。

name: daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: '生成する日付（YYYY-MM-DD）。省略すると今日'
        required: false
  schedule:
    - cron: '0 21 * * *' # 06:00 JST

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # フォークからの PR で secrets を使う生成が走らないようにする。
    # GitHub 標準の secrets 保護に加えて、ここでも明示的に絞る。
    if: github.repository_owner == 'yosuke1024'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generate the day
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run day -- ${{ inputs.date }}

      # 生成が破棄された日でも、失敗記録は残す。
      - name: Validate the data
        if: always()
        run: npm run validate

      - name: Commit the day
        if: always()
        run: |
          git config user.name  'velum'
          git config user.email 'noreply@pixapps.ai'
          git add world characters
          if git diff --staged --quiet; then
            echo "変更なし。"
          else
            git commit -m "world: ${{ inputs.date || '$(date -u +%Y-%m-%d)' }}"
            git push
          fi
