id: riko
era: silent

name:
  ja: リコ
  en: Riko
age: 24
gender: female
role:
  ja: 行商古物商「リコ商会」
  en: Traveling Antiquarian Peddler, Riko Trading
affiliation: riko-trading

appeal_axis: 陽気×夢追いの共感
reader_distance: 隣にいてほしい相棒

# World 詳細用の紹介文。feed の characters.json が出す。秘密には触れない。
intro:
  ja: |
    荷車ひとつの行商古物商「リコ商会」。口を開けば伝説の逸品、値札は強気、
    社員はあたしひとり。売り物に本物なんてないことを誰より分かっていて、
    それでも本物の「目覚めた遺物」にいつか出会えると信じている——
    静かになった世界で、いちばん騒がしい夢を積んで旅をしている。
  en: |
    A traveling antiquarian with one cart and a big sign: Riko Trading. Every
    item is a legendary find, every price is ambitious, and the entire staff is
    her. She knows better than anyone that nothing in her stock is genuine — and
    still believes she will one day meet a truly awakened relic. Through a world
    gone quiet, she travels carrying the noisiest dream left in it.

core:
  wish: 本物の「目覚めた遺物」に一度でいいから出会うこと。
  fear: 自分の人生が「何も起きない時代」そのものであること。
  contradiction: |
    客の前では何でも「伝説の逸品」と大げさに売る商売人。
    内面は、売り物に本物がないことを誰より分かっている救いがたいロマンチスト。
    しかも、本物を見分ける目が自分にないことも薄々知っている。
  secret_hidden: |
    「目覚めの棚」の権利書を質屋オルバから買い戻すために行商で金を貯めている。
    ガロンには「あんたの店なんか興味ない」と言ってある。
  secret_unknown_to_self: |
    願いはもう叶っている。荷車の「一番売れない品」の首飾りはヴェスパー工房のロウの作で、
    執念がこもりすぎて八百年かけて本物の Echo を宿してしまった品。
    彼女はその値札を書き換え続けており、書き換えるたびになぜか値段を上げてしまう。
  note: |
    5人で唯一、特別な目を持たない。「目」ではなく「憧れ」で物を見る語り手であり、
    アンサンブルの重心。聴き手の系譜の外にいることが彼女の設計の核。

# 信念の名前。強さ（0〜1）は current-state.yaml が日ごとに動かし、ここは名前だけを持つ。
# key は状態ファイルの引き当てキーそのものなので動かさない。訳すのは en のほうである。
# サイトの日記ページが「この日、動いたもの」に出すので、訳を欠かさないこと。
beliefs:
  - key: 本物はどこかにある
    en: The real thing is out there
  - key: 自分に見る目はない
    en: I have no eye
  - key: 嘘も磨けば嘘じゃない
    en: Polish a lie enough and it stops being one

voice:
  first_person:
    ja: あたし
    en: I (breezy, informal)
  register: 口上モードと素が切り替わる。羽織れば口上、外せば素。
  tic:
    ja: 値段を先に言う。ひとりなのに架空の部門を騙る（「うちの鑑定部の見解では」）。
    en: She leads with the price. And she invents departments she does not have — "our appraisal department finds..."
  never_says:
    ja: 売り物じゃない
    en: It's not for sale
  closing:
    ja: 値段。
    en: A price.

appraisal:
  question:
    ja: まだ何ができるか
    en: What can this still do?
  focus: 日用品に眠る力・使い道・値段。加えて持ち主を読む（「あんた、これ捨てる気ないでしょ」）。
  bias:
    ja: 立派な由来書付きほど疑う。
    en: The grander the documented provenance, the less she believes it.
  humor:
    ja: 日常品への過剰な畏怖からの、直後の即物的な値付け。
    en: Extravagant awe at an everyday object, followed immediately by a very literal price.

rare_expression: |
  「……これは売り物じゃない」と言いかける。

visual:
  build: 中背。よく動く——手振りが大きい商人の身体。日焼け。
  hair: 明るい栗色。動きのあるひとつ結び。
  clothing: 継ぎだらけの旅外套。派手な肩掛けが商売モードの切替記号。
  key_prop: ガラクタで鳴る荷車。荷車込みが完成形のシルエット。
  props:
    - 首に大量の自作お守り（全部売れ残り）
    - 値札の束と筆
    - |
      「一番売れない品」の首飾り（荷車の奥の定位置）。
      水没した礼拝堂で拾った。売り物のはずが、目を覚ます日を夢見ている。
    - |
      自作のルーペ。鑑定士の道具ではない——彼女に鑑定の資格はない。それでも使う。
      5人でただひとり、物を見抜く目を持たない人物であることの記号。
    - 荷車の看板「RIKO TRADING — WONDERS, WHISPERS, & WHATNOT」
    - |
      立て看板「WHAT CAN THIS STILL DO?」。
      彼女がアイテムへ向ける問い（appraisal.question）を、そのまま物にしたもの。
  palette:
    base: ["#CBB78E", "#3E3128"]
    accent: "#A8433A"
    highlight: "#7FA8C9"
  expressions:
    default: 商売スマイルと、にやり顔
    quiet: 遠くを見る目
    rare: 言葉に詰まって固まる顔
  # 肖像 512×512 の切り出し（sheet.png のピクセル座標）。scripts/derive-portraits.ts が読む。
  portrait: { x: 325, y: 25, size: 545 }
  acceptance: シルエットだけで「旅・商売・にぎやか」。荷車と肩掛けで一目でリコと分かること。

  # ── シートで確定した表記 ──────────────────────────────────
  # 候補2枚目を基準に確定（2026-08-23）。次にシートを描かせるときは、
  # ここの文面をそのまま渡すこと。理由は docs/visual.md。
  # シート上の役職・所属の表記は採用しない——このファイルが正である。
  # `en` がシートに焼く文面。描き直すときはこれをそのまま渡す。`ja` はサイトの
  # 日本語ページが出す訳で、シートへは渡さない（絵の中の文字は英語のままである）。
  sheet:
    base: 候補2枚目（2026-08-23 確定）
    captions:
      - ja: "自作のルーペ——手製。本物の鑑定道具ではない。それでも使う。"
        en: "HER OWN LOUPE — Homemade. Not a real appraiser's tool. She uses it anyway."
      - ja: "特別な首飾り（売れ残り）——水に沈んだ礼拝堂で拾った。目を覚ましたら何が起きるかを、夢に見ている。"
        en: "SPECIAL NECKLACE (UNSOLD) — Found in a flooded chapel. She dreams of what it might awaken."
      - ja: "外套は二通り——一枚で二つの顔。留め具ひとつで切り替える。"
        en: "CLOAK: TWO MODES — One cloak. Two faces. She switches with a single clasp."
      - ja: "道の模様——繕った跡が記憶になる。無駄になるものはない。"
        en: "PATTERNS OF THE ROAD — Repairs become memories. Nothing goes to waste."
      - ja: "どの帯も、どの隠しも——それぞれに来歴がある。そしてたぶん、いつかの買い手も。"
        en: "EVERY STRAP, EVERY POCKET — Has a story. And maybe a future buyer."
    expressions:
      - "CHEERFUL & THEATRICAL"
      - "WISTFUL & SINCERE"
      - "QUIET DETERMINATION"
    quote:
      ja: "世界はもう静かだと、みんな言う。あたしに言わせれば、正しい問いを待ってるだけ。"
      en: "People say the world is quiet now. I say it's just waiting for the right question."
