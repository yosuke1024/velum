id: riko
people:
  - id: garon
    name:
      ja: ガロン
      en: Garon
    relation:
      ja: 元師匠・没落した目利き
      en: Her old master — an eye that fell
    trust: 0.8
    wariness: 0.13
    summary:
      ja: |
        かつての大目利き。今は倉庫番で、酒場で「昔は大物だった」と笑われている。
        リコの持ち出し（実質的な盗み）を知っていて、何も言わなかった。
        信頼は高いが、会いに行けない気まずさがある。
      en: |
        Once a great judge of objects. Now a warehouse keeper, laughed at in taverns as a has-been.
        He knew what Riko took — it was theft, in practice — and said nothing.
        She trusts him completely, and cannot bring herself to visit.
    visual: 大柄で猫背。手入れを諦めた立派な髭。胸に古い銘印をまだ提げている。
    thread: |
      銘印は大鑑定院の系譜の最後の末裔の証。
      ヴァレン → 現行の Artifact Guild への糸の、silent 側の端点。
    intro:
      ja: |
        かつて名の知れた大目利き。今は倉庫番で、酒場では「昔は大物だった」と笑われて
        いる。リコに目利きのいろはを叩き込んだ師匠であり、彼女が唯一、頭の上がらない
        ——そして、どうしても会いに行けずにいる相手。
      en: |
        Once a famous judge of objects; now a warehouse keeper, laughed at in taverns
        as a has-been. The master who taught Riko everything her eye knows — the one
        person she cannot stand up to, and cannot bring herself to visit.
    public_relation:
      ja: 元師匠
      en: Her old master
  - id: mio
    name:
      ja: ミオ
      en: Mio
    relation:
      ja: 常連の少女
      en: A girl who always comes back
    trust: 0.6
    wariness: 0.1
    summary:
      ja: |
        市が立つたび荷車に来て、売れない品ばかり眺めていく無口な少女。
        商売にならない客だが、追い払えない。
      en: |
        Every market day she comes to the cart and looks only at the things that never sell.
        She is no use as a customer, and Riko cannot bring herself to shoo her off.
    hidden_from_protagonist: |
      ミオが眺めているのはいつも「一番売れない品」——彼女には聴こえている。
      原初の「聴き手」の系譜の現代側。リコは気づいていない。
    visual: 小柄。目深なフード。いつも片耳を物に寄せる癖。
    intro:
      ja: |
        市が立つたび荷車にやって来て、売れない品ばかり黙って眺めていく少女。フードを
        目深にかぶり、気になった品にはそっと片耳を寄せる。商売にはならない客だが、
        リコはどうしても追い払えずにいる。
      en: |
        A girl who comes to the cart every market day and looks, in silence, only at
        the things that never sell. She keeps her hood low, and tilts one ear toward
        anything that catches her interest. She is no use as a customer, and Riko
        cannot bring herself to shoo her away.
