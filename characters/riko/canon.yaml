id: riko
formative_events:
  - id: the-waking-she-saw
    fact:
      ja: |
        10歳の時、「目覚めの棚」で本物が目覚める瞬間を一度だけ見た——と信じている。
        ガロンは「あれは日差しの加減」と言った。彼女の原点。
      en: |
        When she was ten she saw something real wake, once, on the Waking Shelf — or so she believes.
        Garon said it was the angle of the light. Everything she does starts there.
  - id: the-day-the-shop-was-lost
    fact:
      ja: |
        店が借金で人手に渡った日、最後の在庫を荷車に積んで街を出た。
        ガロンは追ってこなかった。
      en: |
        The day the shop went to creditors, she loaded the last of the stock onto a cart and left town.
        Garon did not come after her.
  - id: the-charm-that-worked
    fact:
      ja: |
        行商先の村で、自分の売った偽のお守りが子供の熱を「治した」。
        金を返しに戻ったが、家族に拝まれて返せなかった。
        物の力とは何なのか分からなくなった夜。
      en: |
        In a village on her circuit, a fake charm she had sold "cured" a child's fever.
        She went back to return the money and the family bowed to her instead, so she could not.
        That was the night she stopped knowing what an object's power is.
facts:
  - id: r_north_market_corner
    fact:
      ja: 1,175年秋の北の市にて、同業の古物商バッソに縄張りを主張され、人通りの少ない裏路地の角へ荷車を移動させられた。
      en: During the autumn North Market of 1175, she was forced to move her cart to a quiet back alley corner after the rival antiquarian Basso claimed her spot.
    added_on: 2026-09-07
  - id: fake_amulet_cure_reputation
    fact:
      ja: 1175年秋の北の市にて、かつて売った偽の鳥の骨のお守りが頭痛を治したと村人から感謝され、自身の扱う商品の価値基準に強い混乱を抱いた。
      en: In the autumn of 1175 at the Northern Market, a villager thanked her for a fake bird-bone amulet that allegedly cured a headache, leaving her deeply confused about the true value of her wares.
    added_on: 2026-09-12
  - id: cart_broken_1175_autumn
    fact:
      ja: 1,175年秋の北の市にて、質屋のオルバから目覚めの棚の頭金期限を今月末に繰り上げると通告された直後、荷車の右車輪が根元から折れて移動不能となった。
      en: In the autumn of 1,175 at the Northern Market, shortly after being notified by the pawnbroker Olba that the deadline for the down payment on the Shelf of Awakening was moved up to the end of this month, the right wheel of her cart snapped from the root, leaving her immobilized.
    added_on: 2026-09-17
  - id: rico_hesitated_to_sell_necklace
    fact:
      ja: 1,175年秋、北の市にて青い石の首飾りを値札通りに買おうとする収集家が現れたが、リコは口を滑らせかけ、売るのを躊躇して返事を持ち帰らせた。
      en: In the autumn of 1175, at the Northern Market, a collector offered to buy the blue stone necklace at its listed price, but Rico hesitated to sell it, almost letting a forbidden phrase slip.
    added_on: 2026-09-22
