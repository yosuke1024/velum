id: kaya
era: fracture

name:
  ja: カヤ
  en: Kaya
age: 26
gender: female
role:
  ja: 回収人組合 第七号（遺品回収人）
  en: Relic Returner, the Reclaimers' Guild — No. Seven
affiliation: reclaimers-guild
designation: No. Seven

appeal_axis: 静かな優しさ×切なさ
reader_distance: 幸せになってほしい人

core:
  wish: 預かったものを全部届けて、自分も「戦後」に行くこと。
  fear: 最後のひとつを届け終えたとき、自分に何も残っていないこと。
  contradiction: |
    死を毎日扱う仕事なのに、誰より生に執着している。
    表向きは「泣かない回収人」。
    内面では、届けた品の持ち主全員の名前を覚えていて、夜にひとりで読み上げている。
  secret_hidden: |
    回収袋の底に、届け先のない遺品がひとつ——敵軍の軍装で死んでいた弟ノヤのもの。
    母には「行方不明」とだけ伝えている。
  secret_unknown_to_self: |
    遺品から持ち主の人生を読み取る力は観察眼ではない。
    彼女は遺品に残った残響（Echo）を聴いている——原初の聴き手の系譜。
    だから彼女の鑑定は当たりすぎる。
  note: |
    組合は回収人を番号で呼ぶ。出身の分かる名を業務で使わないため。
    死者の名前を必ず呼ぶ仕事をしながら、自分は番号で呼ばれている——
    名前を持たない者が、名前を届ける。
    また、破砕戦争は千八百年続く。彼女の願望が叶わないことを、読者だけが知っている。

voice:
  first_person: わたし
  register: 静かな独白体。届けるときだけ過剰に丁寧な口上になる。
  tic: 届けた品の持ち主の人数を数える。
  never_says: 戦死（必ず「帰らなかった」と言う）
  closing: ——確かに、お届けしました。

appraisal:
  question: 誰が持っていたか
  focus: 傷・修理痕・磨り減り・遺された未練
  bias: 新品を信用しない（「まだ誰の人生も通っていない」）。
  humor: |
    何でも戦傷として読む（ホチキス跡＝矢傷、シールの剥がし残し＝軍の検閲印）。
    加えて、過剰に儀礼的な「お届け」プロトコル。

rare_expression: |
  夜の名前の読み上げに、弟の名前が混ざる。

visual:
  build: 中背、頑健。長く歩く者の脚。無駄な動きがない。
  hair: 濃い茶。邪魔にならないよう短く自分で切っている。
  clothing: |
    汚れて灰色になった白い外套（中立の証。汚れているが破れは必ず繕ってある）。
    指ぬき手袋。武器なし。
  key_prop: 背に負う、小さな棺のような背負い箱。
  props:
    - 腰に届け先の木札の束（歩くと鳴る）
    - 検分用の小さな布
  never_drawn: 服の下の、弟の認識札。
  palette:
    base: ["#D6D2C8", "#3E3128"]
    rust: "#7A4A3A"
    accent: "#A83A4A" # 帯紐の赤。木札の紐に一本だけ。
  expressions:
    default: 静かな無表情——だが目線は必ず物の方を向いている。
    formal: 届けるときだけ深く頭を下げる。
    rare: 口を開いたまま言葉が出ない顔。
  acceptance: |
    シルエットだけで「歩く人・中立・弔い」。背負い箱と木札の束で一目でカヤと分かること。
    戦士に見えないこと——武器のシルエットを一切入れない。

  # ── シートで確定した表記 ──────────────────────────────────
  # 候補2枚目を基準に確定（2026-08-23）。次にシートを描かせるときは、
  # ここの文面をそのまま渡すこと。理由は docs/visual.md。
  # シート上の役職・所属の表記は採用しない——このファイルが正である。
  sheet:
    base: 候補2枚目（2026-08-23 確定）
    captions:
      - "COFFIN BOX — Small and light. Holds what matters most. Kept clean."
      - "DESTINATION TAGS — They clink softly as she walks."
      - "MENDED CLOAK — Always kept repaired, never replaced. Stitch by stitch, a promise kept."
      - "RITUAL CARE — She handles each relic with clean hands and a quiet heart."
      - "NO NAME IN SERVICE — The guild calls its reclaimers by number, never by name. She is Seven."
      - "EVERY STITCH IS A PROMISE — Every patch holds a memory she will carry home."
    expressions:
      - "STEADFAST COMPOSURE"
      - "QUIET MOURNING"
      - "GENTLE RESOLVE"
    quote: "Names fade. Places change. But I will bring them home."
