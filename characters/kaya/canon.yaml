id: kaya
formative_events:
  - id: the-first-delivery
    fact:
      ja: |
        初仕事で、検分せずに届けた遺品が別人の物で、遺族に偽りの死を告げてしまった。
        以来、届ける前に必ず遺品の「人生」を読み切る。
      en: |
        On her first job she delivered belongings without examining them. They were the wrong man's,
        and she told a family a death that had not happened. Since then she reads a relic's whole
        life before she carries it anywhere.
  - id: noya-in-enemy-colours
    fact:
      ja: |
        弟ノヤの遺体を敵軍の軍装で見つけた。認識札だけ回収し、
        埋葬した場所は誰にも言っていない。
      en: |
        She found her brother Noya's body wearing the enemy's colours. She took only his tag,
        and has told no one where she buried him.
  - id: the-pact-at-the-bridge
    fact:
      ja: |
        焼けた橋で、敵側の回収人ダリと「回収人同士は撃たれない」という
        二人だけの協定を交わした。組合の公式協定ではない。
      en: |
        At the burnt bridge she and Dari, the reclaimer from the other side, made a pact of two:
        reclaimers do not shoot reclaimers. It is not a guild agreement.
facts:
  - id: noya_unit_letter_found
    fact:
      ja: 古い峠道で、弟ノヤの認識札と同じ部隊刻印のある未開封の手紙を敵兵の遺体から回収した。
      en: Recovered an unopened letter with the same unit stamp as her brother Noya's from an enemy soldier's body on the old mountain pass.
    added_on: 2026-09-14
  - id: delivery_to_displaced_at_isa_house
    fact:
      ja: ハルナ村の母の家にて、火災で家を失い避難していた遺族へアルベルトの水筒を届けたが、積雪により春まで同村に留まることを余儀なくされた。
      en: At her mother's house in Haruna Village, she delivered Albert's canteen to a displaced family sheltering there, and was forced to remain in the village until spring due to heavy snowfall.
    added_on: 2026-09-24
