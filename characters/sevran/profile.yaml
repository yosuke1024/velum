id: sevran
era: convergence

name:
  ja: セヴラン
  en: Sevran
age: 29
gender: male
role:
  ja: 記録院 書記（最後の一人）
  en: Last Scribe of the Record House
affiliation: record-house

appeal_axis: 知性×不気味なほどの平常心×謎
reader_distance: 頭の中を覗きたい考察対象

core:
  wish: この一年を、嘘なく書き終えること。
  fear: 読む者が誰も残らないこと。
  contradiction: |
    表向きは、世界の終わりに一切動じない——不気味なほど平常運転の事務員。
    悲愴感を見せず、湿った独白もしない。
    内面では、記録だけが正気を保つ手段になっている——
    書くのをやめたら壊れるのは世界ではなく自分。
  secret_hidden: |
    収束の始まりの日、逃げる群衆と逆に走って帳面を取りに戻り、
    そのせいでミルテを見失った。「記録のために人を置き去りにした」と思っている。
  secret_unknown_to_self: |
    記録帳が異界の性質を帯び始めており、まだ起きていないことが書かれているページがある。
    彼はそれを自分の書き間違いだと思い、几帳面に見え消し線で訂正している——
    訂正した内容が、後日そのとおりに起きる。
  note: |
    廃墟にひとりでも、日記の署名に必ず「記録院書記」と肩書きを入れる。組織はもう存在しない。
    存在しない組織の肩書きを名乗り続けることが、彼の平常心の正体。

voice:
  first_person: 僕
  register: 事務的。悲愴感を出さない。喪失は行間にだけ漏れる。
  tic: 事実に「確認」「未確認」「要検証」の注記を付けずにいられない。
  never_says: 終わり（この街が終わった、とは決して書かない）
  closing: ——以上を、本日の記録とする。記録院書記 セヴラン

appraisal:
  question: 何が混ざったか
  focus: 歪み・異界痕・次元の匂い
  bias: あまりに普通の物ほど、何かを隠していると考える。
  humor: あり得ない事象を完全に事務的な様式で記録する deadpan。

rare_expression: |
  「要検証」を付けない一行を書く。または見え消し線で消した注記の下に、断定を書く。
  崩れるのは感情表現ではなく、書式。

visual:
  build: 長身・痩せ型。猫背だが姿勢を正す癖（事務の身体）。眼の下の隈。
  hair: 黒。伸びかけを自分で切ったような不揃い。前髪が片目にかかる。
  clothing: 記録院の制服。着崩れているが、襟だけはいつも留まっている（平常心の記号）。
  key_prop: 鎖で体に繋いだ「今年の記録帳」。表紙は「RECORD OF THE CONVERGENCE / YEAR 4217」。
  props:
    - 肩掛けに何本も挿したペン
    - 携行インク壺
    - 四時十七分で止まった懐中時計
    - インクで黒くなった右手
    - |
      記録帳のページの間に、インクの届かない何かがいる。
      描かない。名指さない。注記の書き方だけで示す。
  palette:
    base: ["#1F2430", "#3A4A63"]
    paper: "#E8E0CF"
    accent: "#6B4E8C" # 裂け目の紫。画面のどこか一点にだけ。
  expressions:
    default: 無表情。事務的な集中顔。
    rare: 無表情のまま目だけが動く顔（泣かせないのがこのキャラの矜持）
  acceptance: |
    シルエットだけで「記録者・疲弊・几帳面」。
    鎖の記録帳と裂け目の紫の一点で、一目でセヴランと分かること。

  # ── シートで確定した表記 ──────────────────────────────────
  # 候補2枚目を基準に確定（2026-08-23）。次にシートを描かせるときは、
  # ここの文面をそのまま渡すこと。理由は docs/visual.md。
  # シート上の役職・所属の表記は採用しない——このファイルが正である。
  sheet:
    base: 候補2枚目（2026-08-23 確定）
    captions:
      - "RECORD BOOK (YEAR 4217) — He writes what must be recorded. And what must not."
      - "POCKET WATCH — Stopped at 4:17. Time is recorded. Time does not move."
      - "FASTENED COLLAR — Always secured. Discipline is the only anchor."
      - "BETWEEN THE PAGES — Something lingers where ink cannot reach. It is not named here."
      - "INK-STAINED HANDS — Every record leaves its mark. Some marks never fade."
    expressions:
      - "CLINICAL OBSERVATION"
      - "FLEETING DISTURBANCE"
      - "UNSPOKEN REALIZATION"
    quote: "I record the convergence of all things. Including the one I do not name."
