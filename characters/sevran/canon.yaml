id: sevran

formative_events:
  - id: the-first-day
    fact: |
      収束初日、帳面を取りに戻ってミルテを見失った。
      大時計が溶けて止まった四時十七分を、今も毎日書き写している。
  - id: the-undercroft
    fact: |
      記録院の地下書庫が裂け目に呑まれ、千年分の記録が消えた。
      その日から「最後の書記」になった。
  - id: hum-moved-in
    fact: |
      廃墟にフムが住み着いた。追い出そうとしたが、そいつが毎晩、
      消えた書庫の本を一冊ずつ暗唱することに気づき、共存を決めた。

