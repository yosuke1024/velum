id: sevran
memories:
  - id: 2026-09-03-1
    summary: アルヴィス広場に現れた木柱に、ミルテの筆跡で『四時十七分』と刻まれているのを確認したこと。
    importance: 0.85
    formed_on: 2026-09-03
  - id: 2026-09-08-2
    summary: フムが『大洪水前夜の官職録』を暗唱した際、本来存在しないはずの「書記ミルテ、四時十七分、外壁に記述を残す」という一節を聞き取った。
    importance: 0.85
    formed_on: 2026-09-08
  - id: 2026-09-13-3
    summary: 地下書庫跡の瓦礫からミルテの青いインクと、二重線で消された『針は』『止まったのではない』『観測』という記述のある手帖の断片を回収。直後に地下書庫への経路が崩落により永久に閉ざされた。
    importance: 0.88
    formed_on: 2026-09-13
