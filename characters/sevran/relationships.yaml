id: sevran

people:
  - id: milte
    name:
      ja: ミルテ
      en: Milte
    relation: 失った相方・同僚の書記
    trust: 0.9
    wariness: 0.0
    summary: |
      収束初日に裂け目へ消えた同僚。死んだとは限らない——
      街のあちこちの壁に、彼女の筆跡が浮かぶという噂がある。
      「彼女を探すこと」と「記録を続けること」が毎日天秤にかかる。
    visual: |
      記憶の中の姿は、三つ編みにペンを挿す癖。
      今は、壁に現れる筆跡そのもの。
    note: 公式記録では「同僚書記M」と書く。日記では「ミルテ」と書く。

  - id: hum
    name:
      ja: フム
      en: Hum
    relation: 異界から来て居着いた「何か」
    trust: 0.4
    wariness: 0.5
    summary: |
      形の定まらない同居人。本棚の影に住む。
      善意なのか観察なのか捕食の準備なのか、不明。
      毎晩、消えた書庫の本を暗唱してくれる——
      ただし時々、存在しないはずの本を暗唱する。
    visual: |
      描かない。影・本の隙間・湯気などとして常に画面の端にいる。
      目や口を与えない。同じ形で二度描かない。
    note: セヴランが便宜上つけた呼び名。呻り声から。
