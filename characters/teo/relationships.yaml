id: teo
people:
  - id: vallen
    name:
      ja: ヴァレン大鑑定官
      en: Vallen, Grand Appraiser
    relation:
      ja: 師匠
      en: His master
    trust: 0.69
    wariness: 0.23
    summary:
      ja: |
        大鑑定院の頂点に立つ伝説の鑑定士。老齢。
        テオに直感を禁じた張本人。厳格。
      en: |
        The legendary appraiser at the top of the Grand Court. Elderly.
        The one who forbade Teo from trusting his instincts. Severe.
    hidden_from_protagonist: |
      テオの出自を実は知っており、黙って庇っている。
      テオは知らず、読者だけが日記の行間から気づける。
    visual: 長身痩躯。胸に勲章のように並ぶ歴代の銘印。片眼鏡。
    intro:
      ja: |
        大鑑定院の頂点に立つ、伝説の大鑑定官。老いた胸には、歴代の銘印が勲章のように
        並ぶ。テオに「直感でものを言うこと」を禁じた張本人であり、規約と手順のほかは
        何も認めない。
      en: |
        The legendary Grand Appraiser at the summit of the Grand Court — an old man
        now, the seals of a lifetime ranked across his chest like medals. He is the one who
        forbade Teo to speak from instinct, and he accepts nothing but code and
        procedure.
  - id: lowe
    name:
      ja: ロウ
      en: Lowe
    relation:
      ja: 兄・贋作師
      en: His brother, a forger
    trust: 0.4
    wariness: 0.64
    summary:
      ja: |
        摘発を生き延びてヴェスパー工房を継いだ兄。今も贋作を作り続け、成功している。
        時折、大鑑定院の門前に現れ、他愛ない話だけして帰る。
        連れ戻したいのか、利用したいのか、ただ会いたいだけなのか、テオには分からない。
      en: |
        He survived the raid and inherited the Vesper Workshop. He still forges, and does well at it.
        Now and then he appears at the gate of the Grand Court, talks about nothing, and leaves.
        Whether he wants Teo back, wants to use him, or only wants to see him, Teo cannot tell.
    visual: テオと同じ癖毛。堂々とした身なりに、指先だけ職人の手。
    intro:
      ja: |
        時折、大鑑定院の門前に現れる兄。身なりは堂々としているのに、指先だけが
        職人の手をしている。他愛ない話だけして帰っていく。連れ戻したいのか、
        利用したいのか、ただ会いたいだけなのか——テオには分からない。
      en: |
        His brother, who appears at the gate of the Grand Court now and then —
        impeccably dressed, and only his fingertips give him away as a craftsman.
        He talks about nothing in particular and leaves. Whether he wants Teo back, wants to use him, or
        only wants to see him, Teo cannot tell.
    public_relation:
      ja: 兄
      en: His brother
