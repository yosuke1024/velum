  - id: 2026-09-06-2
    summary: 持ち込まれた三十年前の鑑定書付き小箱の座金が正常であり、手元の誤鑑定書に記載された「逆打ち」の記録と物理的に矛盾していることを確認した。
    importance: 0.85
    formed_on: 2026-09-06
  - id: 2026-09-11-3
    summary: 地下書庫で三十年前の鑑定原簿を閲覧し、師匠の筆跡を精巧に模した別人による加筆改竄の痕跡を発見したこと。
    importance: 0.9
    formed_on: 2026-09-11
