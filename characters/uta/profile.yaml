id: uta
era: primordial

name:
  ja: ウタ
  en: Uta
age: 19
gender: female
role:
  ja: サナ氏族の「聴き手」（半人前）
  en: Half-Trained Listener of the Sana Tribe
affiliation: sana

appeal_axis: 健気×一途
reader_distance: 報われてほしい妹

# World 詳細用の紹介文。feed の characters.json が出す。秘密には触れない。
intro:
  ja: |
    文字を持たないサナ氏族の、若い「聴き手」。物に残るかすかな声を聴き取り、
    氏族のための兆しに翻訳する。厳かな口上の下で、本当は毎回半信半疑——
    それでも夜にひとり、その日聴いたものを言葉にして唱える。彼女の「日記」は
    書かれたものではなく、誰にも聞かせないその声である。
  en: |
    A young Listener of the Sana, a tribe that has no writing. She catches the
    faint voices left in things and translates them into omens for her people.
    Beneath the solemn recitations she is half in doubt every time — and still,
    alone at night, she speaks aloud what she heard that day. Her "diary" is not
    written; it is that voice no one else hears.

core:
  wish: 自分の聴いた声で、一度でいいから氏族を救うこと。
  fear: 声が自分の妄想にすぎないこと。
  contradiction: |
    表向きは厳かに儀式の口上を張る「聴き手」。
    内心は毎回半信半疑で、儀式の型の半分は自分のでっち上げ。
    誰よりも信じてほしいのに、誰よりも自分が疑っている。
  secret_hidden: |
    正式な継承を受けていないこと。儀式の型の半分が見様見真似の自己流であること。
  secret_unknown_to_self: |
    声は実際にある。彼女が聴いているのは物に残った記憶の残響——
    つまり彼女は Echo の最初の観測者であり、世界最初の鑑定士。
    そして、でっち上げた自己流の型が、八百年後の鑑定の作法として残る。
  note: |
    氏族はウタを「聴き手」と呼ぶが、それは職能の呼び名であって継承の証ではない。
    呼ばれ慣れた肩書きを、まだ正式には持っていない——彼女の焦りの正体。
    サナ氏族に文字はないため、彼女の「日記」は書いたものではなく夜にひとりで唱える言葉。
    5人で唯一、書かない語り手。

voice:
  first_person:
    ja: ウタ（自分の名前）
    en: Uta (her own name)
  register: |
    厳かな口上と、素の年相応の言葉が混ざる。
    自分の名前で自分の行動を語る——「ウタは北へ行けと言った」。
    ただし自分を外から描写しない。「ウタの肌を刺す」「ウタの背に」のような、
    自分を見ている誰かの視点で書かない。あくまで、ウタが見たものを、ウタが唱える。
  tic:
    ja: |
      「……と、声が言っている」（と言いつつ自分の意見を混ぜる）。
      そして夜、ひとりのときだけ「声は言っていない。ウタが言った」と認める。
      この二段が彼女の芯であり、後半を落とすとただの巫女になる。
    en: |
      "...or so the voice says" — while slipping her own opinion in with it.
      Then at night, alone, she admits it: "The voice did not say that. Uta did."
      Both halves are her core; drop the second and she is only a priestess.
  never_says:
    ja: 聴こえない
    en: I cannot hear it
  closing:
    ja: 星祭りまでの夜の数。
    en: The number of nights until the Star Festival.

appraisal:
  question:
    ja: これは何の兆しか
    en: What omen is this?
  focus: 素材の声・霊・禁忌
  bias:
    ja: 磨かれ加工されすぎた物を「声が塞がれている」と嫌う。
    en: She dislikes anything too polished or too worked — "its voice has been stopped up."
  humor:
    ja: |
      現代物の完全な誤読（バーコード＝星図、端子＝精霊の口）。
      加えて、自分の意見を声のせいにする責任転嫁。
    en: |
      Wholesale misreadings of modern things (a barcode is a star chart, a socket is a spirit's mouth).
      And blaming her own opinions on the voice.
  note: |
    「声」に定型はない。物によって単語だったり、感情だったり、匂いのような何かだったりする。
    ウタは毎回それを自分の言葉に翻訳している——翻訳の癖が、彼女の人格そのもの。

rare_expression: |
  「……と、声が言っている」を付けず、自分の言葉で断言する。

visual:
  build: 細身、小柄。裸足。座るとき必ず片膝を立てる（儀式の所作の名残——本人は無自覚）。
  hair: 黒く長い。編み込みに小さな骨と貝。
  face: 頬に夜空色の顔料の線（聴き手の印。自分で引いている——正式には引く資格がない）。
  clothing: |
    生成りの巻き布、獣皮の肩当て。装飾は少なく、素材そのもの。
    原初の沈黙は文字を持たない前史の時代であり、後の時代より工芸が精緻に見えてはいけない。
    冠のような「与えられた権威」の記号は持たない。
  key_prop: |
    髪に挿した骨櫛。最初の聴き手の顎から彫られたもので、先代たちの声で低く鳴る。
    祖母から渡された——正式な継承の儀を経ないまま。
  props:
    - 腰に歩くと鳴る貝の束（拾ったものだけ。奪ったものはない）
    - 儀式用の細い骨笛（シート2枚目には描かれていない。持たせるかは未確定）
  not_held: 歌う石（今は長の天幕にある。奪還がアークの動機）
  palette:
    base: ["#E8E0CF", "#F0EDE4"]
    accent: "#2B3A67"
    pigment: "#FFFFFF"
  expressions:
    default: 厳かな儀式顔（作っている）
    quiet: 年相応の不安顔
    rare: 確信を持って断言する顔——このときだけ大人に見える
  # 肖像 512×512 の切り出し（sheet.png のピクセル座標）。scripts/derive-portraits.ts が読む。
  portrait: { x: 310, y: 30, size: 540 }
  acceptance: |
    シルエットだけで「原初・巫女・若い」。骨櫛と貝の束、裸足で一目でウタと分かること。
    厳かさが「背伸び」に見えること——完成された巫女に見えたら失敗。

  # ── シートで確定した表記 ──────────────────────────────────
  # 候補2枚目を基準に確定（2026-08-23）。次にシートを描かせるときは、
  # ここの文面をそのまま渡すこと。理由は docs/visual.md。
  # シート上の役職・所属の表記は採用しない——このファイルが正である。
  # `en` がシートに焼く文面。描き直すときはこれをそのまま渡す。`ja` はサイトの
  # 日本語ページが出す訳で、シートへは渡さない（絵の中の文字は英語のままである）。
  sheet:
    base: 候補2枚目（2026-08-23 確定）
    captions:
      - ja: "祖霊の骨櫛——初代の聴き手の顎から削り出したもの。先に逝った者たちの声で鳴る。"
        en: "ANCESTOR BONE COMB — Carved from the jaw of the first Listener. Hums with the voices of those who came before."
      - ja: "夜空の顔料——自分で描いた。歪んでいる。墨で書いた祈り。"
        en: "NIGHT-SKY PIGMENT — Self-drawn. Imperfect. A prayer in ink."
      - ja: "貝の房——どれも拾ったもので、取ったものではない。"
        en: "SHELL CLUSTER — Each shell was found, not taken."
      - ja: "語り貝の束——耳に当てて、兆しを訊く。"
        en: "SPEAKING SHELL BUNDLE — She holds it to her ear and asks the omen."
      - ja: "癖——座るときもしゃがむときも、いつも片膝を立てる。"
        en: "HABIT — When she sits or crouches, she always raises one knee."
    expressions:
      - "SOLEMN IN PERFORMANCE"
      - "INWARDLY DOUBTFUL"
      - "QUIETLY CURIOUS"
    quote:
      ja: "ウタは聴く。聴かねばならないから。ウタは信じる。自分で選んだから。"
      en: "I listen because I must. I believe because I choose."
