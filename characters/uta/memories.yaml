    summary: 疫病で倒れた若者の前で骨櫛を掲げたが、何も響かず、適当な言葉をでっち上げることすらできずに黙り込んでしまった。
    importance: 0.85
    formed_on: 2026-09-10
  - id: 2026-09-20-3
    summary: 骨を没収しようとするガルドの前にレンが立ちはだかって守ってくれたが、ガルドから明日までに病人を救う声を証明できなければ追放すると宣告されたこと
    importance: 0.95
