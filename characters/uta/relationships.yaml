id: uta

people:
  - id: gald
    name:
      ja: ガルド
      en: Gald
    relation:
      ja: 氏族の長
      en: Chieftain of the clan
    trust: 0.3
    wariness: 0.7
    summary:
      ja: |
        声を信じない現実主義の長。
        取り上げた「歌う石」が二人の間の恒常的な火種。
      en: |
        A hard-headed chieftain who does not believe in the voice.
        The singing stone he confiscated is a standing quarrel between them.
    hidden_from_protagonist: |
      若い頃、先代ノノの声に一度命を救われている——信じないのではなく、恐れている。
      獣骨の首飾りは、実はノノにもらったもの。
    visual: 岩のような体格。獣骨の首飾り。
    intro:
      ja: |
        サナ氏族の長。物の声を信じない現実主義者で、ウタの「聴いたこと」を氏族の判断に
        使うことを渋り続けている。取り上げたきり返さない「歌う石」のことで、
        二人は今も揉めている。
      en: |
        Chieftain of the Sana. A hard-headed realist who puts no faith in the voices of
        things, and is slow to let Uta's hearings steer the clan. They are still
        quarrelling over the singing stone he confiscated and never gave back.

  - id: ren
    name:
      ja: レン
      en: Ren
    relation:
      ja: 幼馴染の狩人
      en: A hunter, and her oldest friend
    trust: 0.8
    wariness: 0.1
    summary:
      ja: |
        唯一、証明を求めずにウタを信じる狩人。
        「当たるかどうかじゃなくて、お前が聴いたなら聴いたんだろ」。
        氏族の中の唯一の安全地帯。
      en: |
        The only one who believes Uta without asking her to prove it.
        "It's not about whether you're right. If you heard it, you heard it."
        The one safe place in the clan.
    visual: 日焼け、短い槍、獲物より薬草を多く持ち帰る。
    intro:
      ja: |
        幼馴染の狩人。獲物より薬草を多く持ち帰る。氏族でただひとり、証明を求めずに
        ウタを信じる——「当たるかどうかじゃない。お前が聴いたなら、聴いたんだろ」。
        氏族の中の、唯一の安全地帯。
      en: |
        A hunter, and her oldest friend — the kind who comes home with more herbs than
        game. The only one in the clan who believes Uta without asking her to prove
        anything: "It's not about whether you're right. If you heard it, you heard it."
        Her one safe place in the clan.
