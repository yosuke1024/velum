id: uta

formative_events:
  - id: the-morning-nono-died
    fact: |
      ノノが死んだ朝、初めて「声」を聴いた。それは遺品の骨櫛からで、声は謝っていた。
      何を謝っていたのか、まだ分からない。
  - id: the-drought-year
    fact: |
      旱魃の年、水場を「声」で当てて氏族を救った——ことになっているが、半分は勘だった。
      以来、氏族は彼女を頼り、ガルドは彼女を警戒する。
  - id: the-singing-stone-taken
    fact: |
      鳴りの谷から拾った「歌う石」をガルドに取り上げられた。石は今も長の天幕にある。

facts:
  - id: the-bone-comb
    fact: |
      骨櫛は最初の聴き手の顎から彫られたもので、先代たちの声を宿している。
      ノノもそれを受け継いだひとりだった。
    note: |
      キャラクターデザインの制作過程で生まれた設定。2026-08-22 に採用。
      聴き手の系譜（world/threads/cross-era.yaml）を物として可視化する。
